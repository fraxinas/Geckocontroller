esphome:
  name: geckocontrol

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../external_components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Geckocontrol Fallback Hotspot"
    password: !secret fallback_password

#captive_portal:

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  services:
    - service: control_twilight_attenuation
      variables:
        level: float
      then:
        - output.set_level:
            id: daylight_attenuation_output
            level: !lambda 'return level / 100.0;'
ota:
  - platform: esphome

switch:
  - platform: template
    name: "Nighttime / Daytime"
    icon: mdi:theme-light-dark
    lambda: |-
      return id(is_daytime);
    turn_on_action:
      - lambda: |-
          id(is_daytime) = true;
    turn_off_action:
      - lambda: |-
          id(is_daytime) = false;

  - platform: template
    name: "PID Calibration"
    id: pid_calibration_switch
    icon: mdi:tune-vertical
    lambda: |-
      return id(gecko_pid).is_calibrating();
    turn_on_action:
      - lambda: 'id(gecko_pid).start_calibration();'
    turn_off_action:
      - lambda: 'id(gecko_pid).abort_calibration();'

select:
  - platform: template
    name: "Calibration Target"
    id: calibration_target_select
    icon: mdi:target
    optimistic: true
    options:
      - "Heating"
      - "Cooling"
      - "Humidification"
      - "Dehumidification"
    initial_option: "Heating"
    on_value:
      - lambda: 'id(gecko_pid).set_selected_target(i + 1);'

button:
  - platform: template
    id: pump_button
    name: "Let it rain"
    icon: "mdi:weather-rainy"
    on_press:
      - output.turn_on:
          id: rain_pump
      - delay: 4s
      - output.turn_off:
          id: rain_pump

  - platform: template
    id: fog_button
    name: "Sleepy hollow"
    icon: "mdi:weather-fog"
    on_press:
      - output.set_level:
            id: fogger_float
            level: 1.0
      - delay: 30s
      - output.set_level:
            id: fogger_float
            level: 0.0

output:
  - platform: ac_dimmer
    id: dimmer1
    gate_pin: 16
    min_power: 15%
    zero_cross_pin:
      number: 17
      mode: INPUT
      inverted: no
  - platform: slow_pwm
    pin: 15
    id: heat_lamp_pwm
    period: 1min
  - platform: gpio
    pin: 4
    id: rain_pump
  - platform: slow_pwm
    pin: 2
    id: fogger_float
    period: 60s
  - platform: ledc
    pin: 32
    id: component_red
    channel: 0
  - platform: ledc
    pin: 33
    id: component_green
    channel: 2
  - platform: ledc
    pin: 27
    id: component_blue
    channel: 4
  - platform: ledc
    pin: GPIO14
    id: fan_pwm
    frequency: 25000 hz
    channel: 7
  # Rain pump: serves both historic-weather rain simulation and humidification (hygrostat
  # heat_output). Duty is arbitrated inside the component (see PID_CALIBRATION.md); internal
  # caps replace the old max_power. period default 180s.
  - platform: geckorain
    id: rain_pump_float
    pump: rain_pump
    # period: 30min
    weather: weather_precipitation
    humidity: humidity_combined
    hygrostat: hygrostat
    calibration_target: calibration_target
  - platform: template
    id: daylight_attenuation_output
    type: float
    write_action:
      - lambda: |-
          id(twilight_attenuation) = state;
          ESP_LOGD("gecko", "wrote twilight_attenuation: %.2f", id(twilight_attenuation));

# The three lights (heat lamp, daylight lamp, RGB) plus the Sun light effects and the
# thermostat-driven daylight/heatlamp logic are owned by the geckolights component.
geckolights:
  id: gecko_lights
  thermostat: thermostat_air
  twilight_attenuation: twilight_attenuation
  skycond_attenuation: skycond_attenuation
  is_daytime: is_daytime
  calibration_target: calibration_target
  heat_lamp:
    id: heat_lamp
    output: heat_lamp_pwm
    name: "Heat Lamp"
  day_light:
    id: day_light
    output: dimmer1
    name: "Dimmer Daylight"
    gamma_correct: 1.0
    default_transition_length: 0s
  scenic_light:
    id: scenic_light
    name: "Scenic Light"
    red: component_red
    green: component_green
    blue: component_blue
    effects:
      - lambda:
          name: Lightning
          update_interval: 50ms
          lambda: |-
            static bool flashing = true;
            static uint8_t r = 0;
            auto call = id(scenic_light).make_call();
            if (r == 0) {
              call.set_rgb(1.,1.,1.);
              call.perform();
            }
            r = random(1,100);
            if (r > 95) {
              call.set_transition_length(5);
              call.set_brightness(1.0);
              call.perform();
              flashing = true;
            } else if (flashing) {
              call.set_transition_length(300);
              call.set_brightness(0.01);
              call.perform();
              flashing = false;
            }

fan:
  - platform: geckofan
    id: multifan
    name: "Gecko Multifan"
    output: fan_pwm
    hygrostat:
      id: hygrostat
      weight: 4.0
    thermostat:
      id: thermostat_air
    vicinity: temperature_vicinity
    wind_speed: weather_windspeed
    calibration_target: calibration_target

i2c:
  sda: 25
  scl: 26
  scan: True
  id: bus_a

one_wire:
  - platform: gpio
    id: bus_dallas
    pin: 22

sensor:
  - platform: hx711
    name: "Scale"
    dout_pin: 34
    clk_pin: 13
    gain: 128
    update_interval: 15s
    accuracy_decimals: 2
    unit_of_measurement: g
    filters:
      - calibrate_linear:
          - 242000 -> 0
          - 456666 -> 100
      - delta: 0.5
      - lambda: |-
            if (x < 0)
              return {};
            if (x < 2.5)
              return 0.0;
            return x;

  - platform: dallas_temp
    one_wire_id: bus_dallas
    address: !secret DsAddressHeatBed
    name: "Heat Bed Temperature"
    id: temperature_heatbed
    update_interval: 5min

  - platform: dallas_temp
    one_wire_id: bus_dallas
    address: !secret DsAddressSubstrate
    name: "Temperature Substrate"
    id: temperature_substrate
    update_interval: 5min

  # Vicinity = the room temperature where the terrarium stands, provided by Home Assistant.
  # In HA, create a Template/helper sensor with this entity_id that mirrors whichever room
  # temperature sensor you choose; change the source there anytime without reflashing.
  # No reading exists until HA provides one (the fan's vicinity logic stays idle until then).
  - platform: homeassistant
    id: temperature_vicinity
    name: "Vicinity Temperature"
    entity_id: sensor.terrarium_vicinity_temperature
    unit_of_measurement: "°C"
    device_class: temperature

  - platform: bme280_i2c
    temperature:
      name: "Ceiling Temperature"
      oversampling: 16x
      id: temperature_ceiling
      filters:
        - lambda: |-
            if (x > 0 && x < 60)
              return x;
            return {};
    pressure:
      name: "Air Pressure"
    humidity:
      name: "Ceiling Humidity"
      id: humidity_ceiling
      # filters:
      #   - filter_out: 100
      #   - filter_out: 0
    address: 0x76
    update_interval: 15s

  - platform: sht3xd
    temperature:
      name: "Ground Temperature"
      id: temperature_ground
      filters:
        - lambda: |-
            if (x > 0 && x < 60)
              return x;
            return {};
    humidity:
      name: "Ground Humidity"
      id: humidity_ground
    address: 0x44
    update_interval: 20s

  - platform: pulse_counter
    name: "Fan Tacho"
    pin: 35
    unit_of_measurement: rpm
    update_interval: 60s
    filters:
      multiply: 0.5

  - platform: sun
    name: Sun Elevation
    type: elevation

  - platform: homeassistant   # actual historic temperature
    id: weather_temperature
    entity_id: sensor.temperature_in_france_noumea_182_days_ago
    on_value:
      then:
        - climate.control:
              id: thermostat_air
              target_temperature: !lambda |-
                return x;

  - platform: homeassistant   # actual historic humidity
    id: weather_humidity
    entity_id: sensor.humidity_in_france_noumea_182_days_ago
    on_value:
      then:
        - climate.control:
              id: hygrostat
              target_temperature: !lambda |-
                return x;

  - platform: homeassistant   # actual historic rain intensity (range 0-5)
    id: weather_precipitation
    entity_id: sensor.rain_in_france_noumea_182_days_ago
    # consumed directly by the geckorain rain-pump component (rain + humidification arbitration)

  - platform: homeassistant   # actual historic rain intensity (range 0-5)
    id: weather_windspeed
    entity_id: sensor.windspeed_in_france_noumea_182_days_ago

  # actual historic sky conditions
  # a numeric value in the range of (0-22) which indicates increasing sky covering
  # we're going to interpret it as a correction factor for the daylight intensitiy,
  # the higher the value, the more daylight will be dimmed down
  - platform: homeassistant
    id: weather_sky
    entity_id: sensor.sky_in_france_noumea_182_days_ago
    on_value:
      then:
        - lambda: |-
            ESP_LOGD("gecko", "sky value changed to: %.0f", x);
            auto sceniclight = id(scenic_light).make_call();
            if (x == 30) {
              auto daylight = id(day_light).make_call();
              daylight.set_brightness(0.01);
              daylight.set_state(false);
              daylight.perform();
              sceniclight.set_state(true);
              sceniclight.set_effect("Lightning");
              sceniclight.perform();
              return;
            } else if (id(scenic_light)->get_effect_name() == "Lightning") {
              sceniclight.set_effect("None");
              if (id(is_daytime)) {
                auto daylight = id(day_light).make_call();
                daylight.set_state(true);
                daylight.perform();
              }
            }
            if (id(is_daytime)) {
              float scenic_b, day_b, dim_factor;
              auto sceniclight = id(scenic_light).make_call();
              auto daylight = id(day_light).make_call();

              id(scenic_light).current_values_as_brightness(&scenic_b);
              id(day_light).current_values_as_brightness(&day_b);
              ESP_LOGD("gecko", "previous attenuated brightness scenic: %.3f, daylight: %.3f, old skycond_attenuation: %.3f", scenic_b, day_b, id(skycond_attenuation));

              scenic_b /= id(skycond_attenuation);
              day_b /= (id(skycond_attenuation)*id(twilight_attenuation));

              id(skycond_attenuation) = (24-x)/24;
              ESP_LOGD("gecko", "previous normalized brightness scenic: %.3f, daylight: %.3f, new skycond_attenuation: %.3f", scenic_b, day_b, id(skycond_attenuation));

              scenic_b *= id(skycond_attenuation);
              day_b *= (id(skycond_attenuation)*id(twilight_attenuation));
              ESP_LOGD("gecko", "target_brightness: scenic: %.3f, daylight: %.3f", scenic_b, day_b);

              sceniclight.set_transition_length(60*1000);
              sceniclight.set_brightness(scenic_b);
              sceniclight.perform();

              daylight.set_transition_length(60*1000);
              daylight.set_brightness(day_b);
              daylight.perform();
            }

  - platform: homeassistant
    id: moon
    entity_id: sensor.moon_in_france_noumea_182_days_ago
    on_value:
      then:
        - lambda: |-
            std::string effect = id(scenic_light)->get_effect_name();
            if (id(is_daytime) == false && effect == "None") {
              auto call = id(scenic_light).make_call();
              float attenuated_moonlight = (x/2.0 + x/2.0*(id(skycond_attenuation)))/100.0 + 0.01;
              call.set_brightness(attenuated_moonlight);
              call.set_state(x > 0.0 ? true : false);
              call.perform();
            }

  - platform: template
    name: "Combined humidity"
    id: humidity_combined
    update_interval: 15s
    unit_of_measurement: "%"
    device_class: "humidity"
    state_class: "measurement"
    accuracy_decimals: 1
    lambda: |-
      bool have_ceiling = id(humidity_ceiling).has_state() && !std::isnan(id(humidity_ceiling).state);
      bool have_ground = id(humidity_ground).has_state() && !std::isnan(id(humidity_ground).state);
      if (have_ceiling && have_ground)
        return (id(humidity_ceiling).state + id(humidity_ground).state) / 2.0;
      if (have_ground)  // ceiling humidity missing (e.g. filtered out) -> ground only
        return id(humidity_ground).state;
      if (have_ceiling)
        return id(humidity_ceiling).state;
      return {};

time:
  - platform: homeassistant
    id: esptime
    timezone: "Europe/Berlin"
    on_time_sync:
      then:
        - lambda: |-
              auto ts = id(esptime).now();
              ESPTime remote_ts = ESPTime::from_epoch_utc(ts.timestamp - 182*24*60*60);
              char datetimestr[21];
              remote_ts.strftime(datetimestr, 20, "%Y-%m-%d %H:%M:%S");
              ESP_LOGD("gecko", "offset timestamp: %s", datetimestr);
              id(remote_time).set_epoch_time(ts.timestamp - 182*24*60*60);

  - platform: homeassistant
    id: remote_time
    timezone: Pacific/Noumea
    on_time_sync:
      then:
        - logger.log: "Synchronized remote_time"
        - lambda: |-
              auto ts = id(remote_time).now();
              ESPTime remote_ts = ESPTime::from_epoch_utc(ts.timestamp);
              char datetimestr[21];
              remote_ts.strftime(datetimestr, 20, "%Y-%m-%d %H:%M:%S");
              ESP_LOGD("gecko", "remote_time timestamp = %s", datetimestr);

sun:
  id: remote_sun
  time_id: remote_time
  #latitude: -22.6
  #longitude: 167.5
  # Take original Noumea / Nouvelle-Calédonie latitude
  # but mirror it to the northern hemisphere
  # and use actual local longitude
  latitude: 22.6
  longitude: 9.15

  on_sunrise:
    - elevation: 5°
      then:
        - lambda: |-
              auto call = id(scenic_light).turn_on();
              call.set_effect("Sunrise Color");
              call.perform();
              auto call2 = id(day_light).turn_on();
              call2.set_effect("Sunrise Daylight");
              call2.perform();
        - logger.log: Good morning, Gecko.

  on_sunset:
    - elevation: 44°
      then:
        - lambda: |-
              auto call = id(day_light).make_call();  
              call.set_effect("Sunset Daylight");
              call.perform();
    - elevation: 5°
      then:
        - logger.log: Good night, Gecko.
        - lambda: |-
              auto call = id(scenic_light).turn_on();
              call.set_effect("Sunset Color");
              call.perform();

climate:
  - platform: pid
    id: thermostat_air
    name: "Thermostat Air"
    sensor: temperature_ceiling
    default_target_temperature: 22 °C
    heat_output: gecko_lights
    cool_output: multifan
    visual:
      min_temperature: 12
      max_temperature: 36
    control_parameters:
      kp: 2.34544
      ki: 0.00987
      kd: 208.97874

  - platform: pid
    id: hygrostat
    name: "Hygrostat"
    internal: true   # hidden from HA; humidity is exposed as the "Target Humidity" number (%)
    sensor: humidity_combined
    default_target_temperature: 70 °C
    heat_output: rain_pump_float   # humidification is now the rain pump (was fogger)
    cool_output: multifan
    visual:
      min_temperature: 30
      max_temperature: 100
      temperature_step: 2
    control_parameters:
      kp: 0.22
      ki: 0.005
      kd: 6.38

# The hygrostat (a PID climate) is hidden because HA renders a climate setpoint in °C.
# Expose its humidity setpoint as a proper percentage instead. Current humidity is the
# "Combined humidity" sensor (%).
number:
  - platform: template
    name: "Target Humidity"
    id: target_humidity_number
    icon: mdi:water-percent
    device_class: humidity
    unit_of_measurement: "%"
    mode: slider
    min_value: 30
    max_value: 100
    step: 2
    lambda: |-
      return id(hygrostat).target_temperature;
    set_action:
      - climate.control:
          id: hygrostat
          target_temperature: !lambda 'return x;'

# PID auto-calibration: owns 4 tuned parameter sets (heat/cool/humidify/dehumidify),
# persists them, and swaps the active set per climate action. See PID_CALIBRATION.md.
geckopid:
  id: gecko_pid
  thermostat: thermostat_air
  hygrostat: hygrostat
  vicinity: temperature_vicinity
  calibration_target: calibration_target

globals:
   - id: scenic_light_effect
     type: uint8_t
     restore_value: no
     initial_value: '0'

   - id: skycond_attenuation
     type: float
     restore_value: no
     initial_value: '0.7'

   - id: twilight_attenuation
     type: float
     restore_value: no
     initial_value: '1'

   - id: is_daytime
     type: bool
     restore_value: yes
     initial_value: 'false'

   # PID calibration target: 0 none · 1 heat · 2 cool · 3 humidify · 4 dehumidify.
   # Set by geckopid during calibration; read by the actuators to pass the relay output through.
   - id: calibration_target
     type: int
     restore_value: no
     initial_value: '0'

status_led:
  pin: GPIO12
