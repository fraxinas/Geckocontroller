substitutions:
  # Shifts the whole simulated day (sunrise, solar noon, sunset) against the local clock, in hours;
  # positive = later. Fits the terrarium's day to the keepers' daily routine. The sun applies it as
  # a longitude offset (15° per hour). The weather must follow by the same amount: set
  # `offset_hours` of the historic_weather sensor in HA's configuration.yaml to the same value.
  day_shift_hours: 1
  # Actual longitude of the installation.
  local_longitude: 9.15

esphome:
  name: geckocontrol
  includes:
    - external_components/gecko_nest.h
  # Every boot/reflash comes up with all automations ENABLED. The PID climates (heating + humidity)
  # restore their last mode from flash, so a manual OFF would persist -- force them back to HEAT_COOL
  # here. The rain/light/fan enables are globals with restore_value:no (initial true) further down;
  # their template switches carry restore_mode: DISABLED so they mirror the global instead of
  # driving it off during setup().
  on_boot:
  # Outlet 2: apply the restored mode / Aux Power state as soon as the hardware is set up
  # (relay_k92 and the restored globals all set up at HARDWARE = 800). An outlet that should be on
  # still drops while the ESP resets: GPIO2 is low until then.
  - priority: 700
    then:
      - script.execute: outlet2_apply
  - priority: -100
    then:
      - climate.control:
          id: thermostat_air
          mode: HEAT_COOL
      - climate.control:
          id: hygrostat
          mode: HEAT_COOL
      - lambda: 'gecko_nest::nest.setup();'

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ./external_components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Geckocontrol Fallback Hotspot"
    password: !secret fallback_password

#captive_portal:

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
ota:
  - platform: esphome

# Restore values (multifan_auto, is_daytime, calibration sets) are only flushed to flash
# every flash_write_interval; the 60s default loses recent changes across a reboot/power-cut.
# These settings change rarely, so commit them promptly.
preferences:
  flash_write_interval: 15s

switch:
  - platform: template
    name: "Daytime"
    icon: mdi:theme-light-dark
    # The global is the source of truth; the switch only mirrors it. Without DISABLED the
    # template default (ALWAYS_OFF) fires turn_off_action at boot and clobbers the global.
    # geckolights sets it from the sun: day from the end of the sunrise sweep, night from the
    # start of the sunset sweep. Flipping it here is a manual override that holds until the next.
    restore_mode: DISABLED
    lambda: |-
      return id(is_daytime);
    turn_on_action:
      - lambda: |-
          id(is_daytime) = true;
    turn_off_action:
      - lambda: |-
          id(is_daytime) = false;

  - platform: template
    name: "Multifan Auto"
    id: multifan_auto_switch
    icon: mdi:fan-auto
    restore_mode: DISABLED      # mirrors id(multifan_auto); must not drive it at boot
    lambda: |-
      return id(multifan_auto);
    turn_on_action:
      - lambda: |-
          id(multifan_auto) = true;
    turn_off_action:
      - lambda: |-
          id(multifan_auto) = false;
          // Handing over to the "Fan Manual Speed" slider: re-read the fan so it shows the speed
          // the automation left behind instead of a stale value for up to one poll interval.
          id(fan_manual_speed).update();

  # Master enable for the light automation. Off freezes the lamps/RGB in their current state:
  # no sunrise/sunset colours, no illumination/moon/lightning updates. Heating is unaffected
  # (disable it via the thermostat), and day/night still follows the sun, so the heater hand-over
  # between daylight and heat lamp keeps happening. Default on.
  - platform: template
    name: "Light Automation"
    id: lights_enabled_switch
    icon: mdi:weather-sunny
    restore_mode: DISABLED      # mirrors id(lights_enabled); must not drive it at boot
    lambda: |-
      return id(lights_enabled);
    turn_on_action:
      - lambda: |-
          id(lights_enabled) = true;
          // Resume immediately instead of waiting for the next sun/moon/weather event: re-running
          // the weather matrix for the code in force re-applies the weather effect and re-renders
          // the illumination (day) or the scenic moonlight (night).
          id(gecko_weather).reapply();
    turn_off_action:
      - lambda: |-
          id(lights_enabled) = false;

  # Daylight lamp by hand, for testing: while on, the lamp holds "Daylight Manual Level" instead of
  # following the thermostat, day and night (only PID calibration takes it over); it starts from the
  # lamp's current level. Nothing switches it off by itself -- the climate alarms (geckoalarm below)
  # report a terrarium running too hot or too cold. Off after a reboot, like the automations are on.
  - platform: template
    name: "Daylight Manual"
    id: daylight_manual_switch
    icon: mdi:lightbulb-on-outline
    restore_mode: DISABLED      # mirrors geckolights; off at boot
    lambda: |-
      return id(gecko_lights).daylight_manual().has_value();
    turn_on_action:
      - lambda: |-
          const auto &rv = id(day_light).remote_values;
          id(gecko_lights).set_daylight_manual(rv.is_on() ? rv.get_brightness() : 0.0f);
          id(daylight_manual_level).publish_state(rv.is_on() ? rv.get_brightness() * 100.0f : 0.0f);
    turn_off_action:
      - lambda: |-
          id(gecko_lights).set_daylight_manual(nullopt);

  # Weather-driven thermostat setpoint: on = the historic Noumea temperature sets the thermostat
  # target on every update; off = the target stays where it was set manually (HA / Geckoconsole).
  # Default on; switching it back on applies the current weather temperature right away.
  - platform: template
    name: "Weather Setpoint"
    id: weather_setpoint_switch
    icon: mdi:thermometer-auto
    restore_mode: DISABLED      # mirrors id(weather_setpoint); must not drive it at boot
    lambda: |-
      return id(weather_setpoint);
    turn_on_action:
      - lambda: |-
          id(weather_setpoint) = true;
      - if:
          condition:
            lambda: 'return id(weather_temperature_setpoint).has_state();'
          then:
            - climate.control:
                id: thermostat_air
                target_temperature: !lambda 'return id(weather_temperature_setpoint).state;'
    turn_off_action:
      - lambda: |-
          id(weather_setpoint) = false;

  # Master enable for the rain/humidification automation. Off stops all automatic pump activity;
  # the "Let it rain" button still works. Default on. Switches itself off when the reservoir is
  # empty (and refuses to stay on) until "Reservoir refilled" is pressed.
  - platform: template
    name: "Rain Automation"
    id: rain_enabled_switch
    icon: mdi:weather-pouring
    restore_mode: DISABLED      # mirrors id(rain_enabled); must not drive it at boot
    lambda: |-
      return id(rain_enabled);
    turn_on_action:
      - lambda: |-
          id(rain_enabled) = true;
    turn_off_action:
      - lambda: |-
          id(rain_enabled) = false;

  # Measures the rain pump's reservoir runtime: fill the reservoir, switch on (the pump runs
  # continuously), switch off once the pump draws air. 95 % of the measured time becomes the
  # reservoir runtime; then refill and press "Reservoir refilled". Gives up after 30 min.
  - platform: template
    name: "Reservoir Calibration"
    id: reservoir_calibration_switch
    icon: mdi:timer-play-outline
    restore_mode: DISABLED      # mirrors geckorain; a boot turn_off_action would end a calibration
    lambda: |-
      return id(rain_pump_float).is_calibrating_reservoir();
    turn_on_action:
      - lambda: 'id(rain_pump_float).start_reservoir_calibration();'
    turn_off_action:
      - lambda: 'id(rain_pump_float).stop_reservoir_calibration();'

  - platform: template
    name: "PID Calibration"
    id: pid_calibration_switch
    icon: mdi:tune-vertical
    restore_mode: DISABLED      # mirrors geckopid; a boot turn_off_action would abort_calibration()
    lambda: |-
      return id(gecko_pid).is_calibrating();
    turn_on_action:
      - lambda: 'id(gecko_pid).start_calibration();'
    turn_off_action:
      - lambda: 'id(gecko_pid).abort_calibration();'

  # HW Rev 2.0: relay K92 (Relay2_out) switching the 2nd mains outlet. Internal: what drives it is
  # set by "Outlet 2 Mode" (select below) -- the "Grow Light" fader, or the "Aux Power" switch.
  # Comes up off; on_boot applies the mode right after.
  - platform: gpio
    pin: 2
    id: relay_k92
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - logger.log: "Outlet 2 (K92) ON"
    on_turn_off:
      - logger.log: "Outlet 2 (K92) OFF"

  # Manual on/off of outlet 2 in "Aux Power" mode (currently the Geckoconsole's PSU). In
  # "Grow Light" mode the fader owns the outlet: the switch reads off and refuses to be switched.
  # The on/off state is persisted (default on), so it survives reboots and mode round trips.
  - platform: template
    name: "Aux Power"
    id: aux_power_switch
    icon: mdi:power-socket-de
    restore_mode: DISABLED      # mirrors id(outlet2_aux_on); must not drive it at boot
    lambda: |-
      return id(outlet2_aux) && id(outlet2_aux_on);
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(outlet2_aux);'
          then:
            - lambda: 'id(outlet2_aux_on) = true;'
            - switch.turn_on: relay_k92
          else:
            - logger.log:
                level: WARN
                format: "Outlet 2 is in Grow Light mode: Aux Power switch disabled"
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(outlet2_aux);'
          then:
            - lambda: 'id(outlet2_aux_on) = false;'
            - switch.turn_off: relay_k92
          else:
            - logger.log:
                level: WARN
                format: "Outlet 2 is in Grow Light mode: Aux Power switch disabled"

select:
  # What outlet 2 (relay K92) supplies. "Grow Light": the growlight PSU's mains, switched with the
  # "Grow Light" fader. "Aux Power": something else hangs on it (currently the Geckoconsole's PSU);
  # the growlight leaves it alone and the "Aux Power" switch turns it on/off. Persisted; the default
  # is Aux Power so a fresh flash never cuts the console.
  - platform: template
    name: "Outlet 2 Mode"
    id: outlet2_mode_select
    icon: mdi:power-socket-de
    entity_category: config
    options:
      - "Grow Light"
      - "Aux Power"
    lambda: |-
      return std::string(id(outlet2_aux) ? "Aux Power" : "Grow Light");
    set_action:
      - lambda: 'id(outlet2_aux) = (x == "Aux Power");'
      - component.update: outlet2_mode_select
      - script.execute: outlet2_apply

  - platform: template
    name: "Calibration Target"
    id: calibration_target_select
    icon: mdi:target
    optimistic: true
    # Order maps to geckopid targets via i+1: 1 heat_day · 2 heat_night · 3 cool · 4 humidify · 5 dehumidify.
    options:
      - "Heating (Daylight)"
      - "Heating (Heat lamp)"
      - "Cooling"
      - "Humidification"
      - "Dehumidification"
    initial_option: "Heating (Daylight)"
    on_value:
      - lambda: 'id(gecko_pid).set_selected_target(i + 1);'

  # Testing aid: pick a weather condition and the geckolights matrix immediately drives the
  # terrarium (illumination + rain + effect). "(live)" releases back to the historic weather_code
  # feed. Partly cloudy and shower codes send passing clouds across the sun.
  # The labels' WMO codes are listed in `codes[]` below (index-aligned to the options).
  - platform: template
    name: "Weather Override (test)"
    id: weather_override_select
    icon: mdi:weather-partly-cloudy
    optimistic: true
    options:
      - "(live)"
      - "Clear"
      - "Partly cloudy"
      - "Overcast"
      - "Fog"
      - "Drizzle"
      - "Light rain"
      - "Rain"
      - "Heavy rain"
      - "Snow"
      - "Rain showers"
      - "Thunderstorm"
      - "Severe thunderstorm"
    initial_option: "(live)"
    on_value:
      - lambda: |-
          static const int codes[] = {-1, 0, 2, 3, 45, 53, 61, 63, 65, 73, 81, 95, 99};
          if (i == 0) { id(gecko_weather).clear_override(); return; }
          id(gecko_weather).set_weather_code(codes[i], true);

button:
  # Testing aids: play the sunrise / sunset sweep now, at 10 s per step (~1 min). Day/night is not
  # touched; while the sweep runs the daylight lamp is off (the heat lamp heats instead) and the
  # growlight cross-fades as at the real thing. Also on the console's Settings page.
  - platform: template
    name: "Sunrise (test)"
    icon: mdi:weather-sunset-up
    entity_category: config
    on_press:
      - lambda: 'id(gecko_lights).test_sweep(true);'
  - platform: template
    name: "Sunset (test)"
    icon: mdi:weather-sunset-down
    entity_category: config
    on_press:
      - lambda: 'id(gecko_lights).test_sweep(false);'

  - platform: template
    id: pump_button
    name: "Let it rain"
    icon: "mdi:weather-rainy"
    # Runs through geckorain so the runtime is deducted from the reservoir; refused when it is empty.
    on_press:
      - lambda: 'id(rain_pump_float).run_manual(4000);'

  # Press after refilling the rain pump's reservoir: restores the full pump runtime and switches the
  # rain automation back on if the empty reservoir had switched it off.
  - platform: template
    id: reservoir_refilled_button
    name: "Reservoir refilled"
    icon: mdi:cup-water
    on_press:
      - lambda: 'id(rain_pump_float).refill_reservoir();'

output:
  - platform: ac_dimmer
    id: dimmer1
    gate_pin: 16
    method: leading_pulse
    min_power: 15%
    zero_cross_pin:
      # 6N139 open collector, pulled up externally by R81 (GPIO34 is input-only, no internal pulls)
      number: 34
      mode: INPUT
      inverted: no
  - platform: slow_pwm
    pin: 4
    id: heat_lamp_pwm
    period: 5min
  - platform: gpio
    pin: 15
    id: rain_pump
  - platform: ledc
    pin: 33
    id: component_red
    channel: 0
  - platform: ledc
    pin: 14
    id: component_green
    channel: 2
  - platform: ledc
    pin: 32
    id: component_blue
    channel: 4
  # HW Rev 2.0 high-current white channel (MCP1416 gate driver + AOD442), the growlight's PWM
  # dimmer -- see "Grow Light" below. Channel 1 shares
  # LEDC timer 0 with red at the same default frequency; 6 would collide with the 25 kHz fan timer.
  - platform: ledc
    pin: 27
    id: component_white
    channel: 1
  - platform: ledc
    pin: 17
    id: fan_pwm
    frequency: 25000 hz
    channel: 7
  # Rain pump: serves both historic-weather rain simulation and humidification (hygrostat
  # heat_output). Duty is arbitrated inside the component (see PID_CALIBRATION.md); internal
  # caps replace the old max_power. period default 180s.
  - platform: geckorain
    id: rain_pump_float
    pump: rain_pump
    # period: 30min
    weather: weather_precipitation
    humidity: humidity_combined
    hygrostat: hygrostat
    calibration_target: calibration_target
    enabled: rain_enabled
    # Pump runtime one filling of the 1 l reservoir bottle lasts, minus a safety margin; every pump
    # run (rain, misting, calibration, "Let it rain") is deducted from it. When it is used up, the
    # pump is locked out and the rain automation switches off until "Reservoir refilled" is pressed.
    # "Reservoir Calibration" measures and replaces it (kept in flash, until this value is edited).
    # 0s disables reservoir tracking.
    reservoir_runtime: 1min
    reservoir_level: reservoir_level
    reservoir_runtime_sensor: reservoir_runtime

# The WMO weather matrix and the resolved weather state, owned separately from the lights: it is
# the single answer to "what is the weather doing right now", and its consumers are unrelated to
# each other -- the rain pump reads the precipitation sensor, the illumination controller reads the
# attenuation global, and geckolights subscribes for the light effect. None of that belongs to a
# lights component.
geckoweather:
  id: gecko_weather
  code_sensor: weather_code
  temperature_sensor: weather_temperature
  humidity_sensor: weather_humidity
  temperature_setpoint: weather_temperature_setpoint
  humidity_setpoint: weather_humidity_setpoint
  precipitation: weather_precipitation
  attenuation: skycond_attenuation
  # Standard day/night cycle for when the historic feed is missing -- HA unreachable, or no record
  # for this hour ("unavailable"). Without it the terrarium would sit on whatever HA sent last, a hot
  # afternoon or a cold night, for as long as HA is gone. Per feed: once lost for `timeout`, the
  # fallback stands in until HA sends a valid value again ("Weather Fallback" shows it).
  # Hours are solar hours at the sun's longitude below, so the cycle runs with the simulated day.
  fallback:
    time_id: esptime
    timeout: 10min
    longitude: ${ local_longitude - 15 * day_shift_hours }   # same as the sun's
    # Cosine over the day: day values at warmest_hour, night values twelve hours later.
    warmest_hour: 15
    temperature: { day: 26, night: 21 }
    humidity: { day: 65, night: 80 }
    code: 1                                     # mainly clear, a few passing clouds
    # With the weather code lost there is no rain at all, so give a short shower once a day -- in
    # the morning, so the simulated sun dries the excess water rather than it staying damp overnight.
    # Through geckorain, so it honours "Rain Automation" and the reservoir lockout.
    rain_hour: 8
    on_rain:
      - if:
          condition:
            lambda: 'return id(rain_enabled);'
          then:
            - lambda: 'id(rain_pump_float).run_manual(5000);'
  # WMO weather-code matrix: maps each Open-Meteo weather_code to cloud cover in oktas, rain
  # intensity (0..5, published to weather_precipitation for the pump) and an optional light effect.
  #
  # oktas (0 = clear .. 8 = overcast) is the single sky-attenuation input: the device turns it into
  # a brightness factor as 1 - oktas/9, i.e. 0 -> 100%, 1 -> 89%, 2 -> 78%, 3 -> 67%, 4 -> 56%,
  # 5 -> 44%, 6 -> 33%, 7 -> 22%, 8 -> 11%. That factor is what the terrarium *looks* like: it
  # drives the growlight by day and the moonlight by night, and nothing else. The daylight lamp
  # is not weather-dimmed any more -- it is the daytime heater and belongs to the PID.
  # So these are illumination figures, not heater figures: overcast is a dull day (3 oktas / 67%),
  # not the near-dark the old heater-facing scale used.
  #
  # clouds (0..100%) is broken cloud drifting across the sun on top of that steady sky: single
  # clouds slide in over 30-90 s, sit for up to two minutes and slide off, dimming the growlight.
  # The more clouds, the shorter the clear gaps and the deeper they go (up to 70% at 100%).
  # Uniform overcast, fog and steady rain have none -- nothing to drift.
  #
  # Effect: "Lightning" (scenic RGB flicker). While the weather has an effect the scene is dark,
  # whatever the oktas say: growlight and daylight lamp off, the heat lamp heats instead (as at
  # night). Edit freely.
  default: { oktas: 0, rain: 0 }               # unmapped code -> clear
  rules:
    - codes: [0]                                # clear
      oktas: 0
    - codes: [1]                                # mainly clear
      oktas: 1
      clouds: 25%
    - codes: [2]                                # partly cloudy
      oktas: 2
      clouds: 50%
    - codes: [3]                                # overcast
      oktas: 3
    - codes: [45, 48]                           # fog / rime fog
      oktas: 5
    - codes: [51, 56]                           # light drizzle
      oktas: 4
      rain: 1
    - codes: [53, 57]                           # drizzle
      oktas: 5
      rain: 2
    - codes: [55]                               # heavy drizzle
      oktas: 6
      rain: 3
    - codes: [61]                               # light rain
      oktas: 5
      rain: 4
    - codes: [63, 66]                           # rain
      oktas: 6
      rain: 5
    - codes: [65, 67]                           # heavy rain
      oktas: 7
      rain: 6
    - codes: [71, 77]                           # light snow / grains
      oktas: 4
      rain: 1
    - codes: [73]                               # snow
      oktas: 6
      rain: 4
    - codes: [75]                               # heavy snow
      oktas: 7
      rain: 5
    - codes: [80, 85]                           # light rain / snow showers
      oktas: 4
      rain: 2
      clouds: 60%
    - codes: [81, 86]                           # rain / snow showers
      oktas: 5
      rain: 3
      clouds: 70%
    - codes: [82]                               # violent rain showers
      oktas: 7
      rain: 5
      clouds: 80%
    - codes: [95, 96, 99]                       # thunderstorms
      oktas: 8
      rain: 4
      effect: "Lightning"

# The three lights (heat lamp, daylight lamp, RGB) plus the Sun light effects and the
# thermostat-driven daylight/heatlamp logic are owned by the geckolights component.
geckolights:
  id: gecko_lights
  thermostat: thermostat_air
  skycond_attenuation: skycond_attenuation
  is_daytime: is_daytime
  calibration_target: calibration_target
  enabled: lights_enabled
  moon: moon
  weather: gecko_weather
  # Visible illumination: what the terrarium *looks* like, which since the daylight lamp became a
  # pure heater (it follows the PID demand down to zero) is no longer the daylight lamp's job. The
  # setpoint is the weather matrix's illumination factor scaled by the sun's current elevation, and
  # the growlight alone renders it: the scenic RGB is no daylight, it stays dark by day and is only
  # there for the sunrise/sunset sweeps, Lightning and the moon. The growlight is still lit when the
  # sunset sweep starts and fades out over its first step while the first colour fades in, so the
  # terrarium never goes dark in between (the sunrise hands over the same way, in reverse).
  # `full_elevation` is the sun elevation counted as full daylight: the equinox noon at this latitude
  # (90 - 22.6 = 67.4 deg). Summer middays clip at 100%, winter ones dim with the lower sun.
  # HW Rev 2.0 dims the growlight via PWM, so it is given as `growlight_light` and held at the
  # setpoint as its level, driven through the "Grow Light" entity itself (relay power-up, state in
  # HA) and only when the level moves. A switched `growlight` would be slow-PWM'd over `period`.
  # Human sleeping hours: from 23:30 local until the night ends at sunrise, halve the scenic
  # moonlight so it stops glowing into the room. Local clock on purpose -- the weather feed runs on
  # Noumea time, but whoever is trying to sleep is here.
  # The sun-driven day, all from `illumination.sun` below: the "Sunrise Color" sweep starts as the
  # rising sun passes 5°, and the day -- the daylight lamp taking over heating -- begins once it has
  # played (~18 min). "Sunset Color" starts at 5° on the way down, and so does the night: the
  # bright daylight lamp would wash the sunset out, so the invisible heat lamp heats from there.
  sunrise_elevation: 5
  sunset_elevation: 5
  quiet_hours:
    time: esptime
    start: "23:30:00"
    factor: 50%
  illumination:
    sun: remote_sun
    growlight_light: grow_light
    period: 5min
    full_elevation: 67.4
    sensor: illumination_setpoint
  heat_lamp:
    id: heat_lamp
    output: heat_lamp_pwm
    name: "Heat Lamp"
    on_turn_on:
      - logger.log: "Heat Lamp ON"
    on_turn_off:
      - logger.log: "Heat Lamp OFF"
  day_light:
    id: day_light
    output: dimmer1
    name: "Dimmer Daylight"
    gamma_correct: 1.0
    default_transition_length: 0s
  # The Sunrise/Sunset and Lightning effects are registered in C++ by the geckolights component.
  # (Passing clouds are no longer an effect here -- see the illumination controller above.)
  scenic_light:
    id: scenic_light
    name: "Scenic Light"
    red: component_red
    green: component_green
    blue: component_blue

# Growlight PWM fader on the HW Rev 2.0 white channel. Driven by the illumination controller
# (`growlight_light` above) and manually from HA. With "Outlet 2 Mode" = "Grow Light", any level
# > 0 powers relay K92 (outlet 2) and going to 0 drops it after 30 s; in "Aux Power" mode the
# fader leaves the outlet alone. gamma 1.0 keeps the duty linear, so the level follows the sun's
# sin(elevation) the way the controller computes it.
light:
  - platform: monochromatic
    id: grow_light
    name: "Grow Light"
    icon: mdi:sprout
    output: component_white
    gamma_correct: 1.0
    on_state:
      - lambda: |-
          const auto &rv = id(grow_light).remote_values;
          ESP_LOGD("gecko", "Grow Light %s, brightness %.0f%%", rv.is_on() ? "ON" : "OFF",
                   rv.get_brightness() * 100.0f);
      - if:
          condition:
            lambda: 'return !id(outlet2_aux) && id(grow_light).remote_values.is_on();'
          then:
            - script.stop: growlight_power_off_delayed
            - if:
                condition:
                  switch.is_off: relay_k92
                then:
                  - switch.turn_on: relay_k92
    on_turn_off:
      - if:
          condition:
            lambda: 'return !id(outlet2_aux);'
          then:
            - script.execute: growlight_power_off_delayed

script:
  # Drives outlet 2 per the current mode: "Aux Power" -> the Aux Power switch's state; "Grow Light"
  # -> the fader (on if lit, else off after the usual 30 s). Run at boot and on every mode change.
  - id: outlet2_apply
    then:
      - if:
          condition:
            lambda: 'return id(outlet2_aux);'
          then:
            - script.stop: growlight_power_off_delayed
            - if:
                condition:
                  lambda: 'return id(outlet2_aux_on);'
                then:
                  - switch.turn_on: relay_k92
                else:
                  - switch.turn_off: relay_k92
          else:
            - if:
                condition:
                  lambda: 'return id(grow_light).remote_values.is_on();'
                then:
                  - switch.turn_on: relay_k92
                else:
                  - script.execute: growlight_power_off_delayed

  # Grow Light mode only: the aux check is repeated at the end in case the mode flipped meanwhile.
  - id: growlight_power_off_delayed
    mode: restart
    then:
      - logger.log: "Grow Light at 0%: cutting outlet 2 (K92) in 30s"
      - delay: 30s
      - if:
          condition:
            lambda: 'return !id(outlet2_aux) && !id(grow_light).remote_values.is_on();'
          then:
            - switch.turn_off: relay_k92

fan:
  - platform: geckofan
    id: multifan
    # The HA-facing fan entity ("Gecko Multifan Status"). Its speed is written by the combined PID
    # formula in auto mode and by the "Fan Manual Speed" number in manual mode; either way the
    # component mirrors it onto fan_pwm.
    fan_id: multifan_status
    name: "Gecko Multifan"
    output: fan_pwm
    hygrostat:
      id: hygrostat
    thermostat:
      id: thermostat_air
    vicinity: temperature_vicinity
    tacho: fan_tacho
    wind_speed: weather_windspeed
    calibration_target: calibration_target
    auto_mode: multifan_auto

i2c:
  sda: 25
  scl: 26
  scan: True
  id: bus_a

one_wire:
  - platform: gpio
    id: bus_dallas
    pin: 22

sensor:
  # HW Rev 2.0: NAU7802 on the I2C bus (0x2A) replaces the HX711. AVDD comes from the internal
  # LDO (DVDD via JP61), so ldo_voltage must stay below 3V3 - 0.3 V.
  - platform: nau7802
    name: "Scale"
    id: gecko_scale
    i2c_id: bus_a
    address: 0x2A
    ldo_voltage: "3.0V"
    gain: 128
    samples_per_second: 10
    update_interval: 15s
    accuracy_decimals: 1
    unit_of_measurement: g
    filters:
      # TODO: points were measured with the HX711 on HW Rev 1.2 -- re-calibrate on the NAU7802.
      - calibrate_linear:
          - 212500 -> 0
          - 234000 -> 10
          - 253900 -> 20
          - 316700 -> 50
          - 419000 -> 100
      - delta: 0.5
      - lambda: |-
            if (x < 0)
              return {};
            if (x < 2.5)
              return 0.0;
            return x;

  # Mean weight of each stay in the nest, published as the gecko leaves (gecko_nest.h)
  - platform: template
    id: gecko_stay_weight
    name: "Gecko Stay Weight"
    unit_of_measurement: g
    accuracy_decimals: 1
    state_class: measurement
    icon: mdi:scale
    update_interval: never

  # - platform: dallas_temp
  #   one_wire_id: bus_dallas
  #   address: !secret DsAddressSubstrate
  #   name: "Temperature Substrate"
  #   id: temperature_substrate
  #   update_interval: 10s
  #   accuracy_decimals: 1
  #   filters:
  #     # DS18B20 power-on/error default (85.0) and disconnected (-127.0) are not real readings.
  #     # Anchored per entry so other DS18B20 sensors can reuse them and still add their own.
  #     - filter_out: 85.0
  #     - filter_out: -127.0
  #     - delta: 0.5

  # Vicinity = the room temperature where the terrarium stands, taken from the current
  # temperature (Ist-Temperatur) of the climate.arbeit entity in Home Assistant.
  # No reading exists until HA provides one (the fan's vicinity logic stays idle until then).
  - platform: homeassistant
    id: temperature_vicinity
    name: "Vicinity Temperature"
    entity_id: climate.arbeit
    attribute: current_temperature
    unit_of_measurement: "°C"
    device_class: temperature

  - platform: bme280_i2c
    temperature:
      name: "Ceiling Temperature"
      oversampling: 16x
      id: temperature_ceiling
      # Rounded to what the BME280 can actually resolve: the 0.01 K digit is noise, and the
      # Thermostat Air PID climate republishes on every change in it (i.e. on every reading).
      accuracy_decimals: 1
      filters:
        - lambda: |-
            if (x < 60)
              return x;
            return {};
        - round: 1
    pressure:
      name: "Air Pressure"
    humidity:
      name: "Ceiling Humidity"
      id: humidity_ceiling
      # filters:
      #   - filter_out: 100
      #   - filter_out: 0
      accuracy_decimals: 0
    address: 0x76
    update_interval: 15s

  - platform: sht3xd
    temperature:
      name: "Ground Temperature"
      id: temperature_ground
      filters:
        - lambda: |-
            if (x > 0 && x < 60)
              return x;
            return {};
      accuracy_decimals: 1
    humidity:
      name: "Ground Humidity"
      id: humidity_ground
      accuracy_decimals: 0
    address: 0x44
    update_interval: 20s

  # - platform: sht4x
  #   temperature:
  #     name: "Ground Temperature"
  #     id: temperature_ground
  #     filters:
  #       - lambda: |-
  #           if (x > 0 && x < 60)
  #             return x;
  #           return {};
  #       - calibrate_linear:
  #           - 0.7 -> -6.6
  #           - 30.4 -> 25.12
  #   humidity:
  #     name: "Ground Humidity"
  #     id: humidity_ground
  #     accuracy_decimals: 0
  #   address: 0x44
  #   update_interval: 20s

  - platform: pulse_counter
    name: "Fan Tacho"
    id: fan_tacho
    pin: 35
    unit_of_measurement: rpm
    update_interval: 10s
    accuracy_decimals: 0
    filters:
      - multiply: 0.5
      - delta: 5.0

  - platform: sun
    name: Sun Elevation
    type: elevation

  # Historic temperature/humidity from HA. Not applied directly: geckoweather passes valid values
  # on to the setpoint sensors below, or its fallback cycle while HA does not provide them.
  - platform: homeassistant   # actual historic temperature
    id: weather_temperature
    name: "Historic Temperature"   # named for "Sensor Problem Details"; internal, HA has it already
    internal: true
    entity_id: sensor.temperature_in_france_noumea_182_days_ago

  - platform: homeassistant   # actual historic humidity
    id: weather_humidity
    name: "Historic Humidity"
    internal: true
    entity_id: sensor.humidity_in_france_noumea_182_days_ago

  # The temperature/humidity the climates follow, published by geckoweather: the historic value, or
  # the standard day/night cycle while the feed is lost (see "Weather Fallback").
  - platform: template
    id: weather_temperature_setpoint
    name: "Weather Temperature"
    unit_of_measurement: "°C"
    device_class: temperature
    icon: mdi:thermometer-auto
    accuracy_decimals: 1
    on_value:
      then:
        - if:
            condition:
              lambda: 'return id(weather_setpoint);'   # "Weather Setpoint" switch
            then:
              - climate.control:
                  id: thermostat_air
                  target_temperature: !lambda |-
                    return x;

  - platform: template
    id: weather_humidity_setpoint
    name: "Weather Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    icon: mdi:water-percent
    accuracy_decimals: 0
    on_value:
      then:
        - climate.control:
              id: hygrostat
              target_temperature: !lambda |-
                return x;

  # Visible-illumination setpoint (0-100%) published by the geckolights illumination controller:
  # the weather matrix's illumination factor scaled by the sun's elevation. Read-only readout --
  # it is the growlight's level.
  - platform: template
    id: illumination_setpoint
    name: "Illumination"
    unit_of_measurement: "%"
    icon: mdi:brightness-5
    accuracy_decimals: 0

  # Rain intensity (0-5) is now derived from the WMO weather code by the geckolights weather
  # matrix and published here; the geckorain rain-pump component consumes it as before.
  - platform: template
    id: weather_precipitation
    name: "Rain intensity"
    accuracy_decimals: 0

  # Remaining fill of the rain pump's reservoir, published by geckorain from the pump runtime left.
  - platform: template
    id: reservoir_level
    name: "Reservoir Level"
    unit_of_measurement: "%"
    icon: mdi:cup-water
    accuracy_decimals: 0
    state_class: measurement

  # Pump runtime one reservoir filling lasts, as configured or as measured by "Reservoir Calibration".
  - platform: template
    id: reservoir_runtime
    name: "Reservoir Runtime"
    unit_of_measurement: "s"
    device_class: duration
    icon: mdi:timer-sand
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: homeassistant   # actual historic rain intensity (range 0-5)
    id: weather_windspeed
    entity_id: sensor.windspeed_in_france_noumea_182_days_ago

  # Raw WMO weather interpretation code (Open-Meteo weather_code) from the HA historic-weather
  # plugin. Single source of truth: the geckolights weather matrix maps it to cloud-cover dimming,
  # rain intensity and a light effect. (Replaces the old back-converted 0..22 "sky" sensor.)
  - platform: homeassistant
    id: weather_code
    name: "Historic Weather Code"
    internal: true
    entity_id: sensor.weather_code_in_france_noumea_182_days_ago

  # Consumed by the geckolights component (moon -> scenic moonlight at night).
  - platform: homeassistant
    id: moon
    entity_id: sensor.moon_in_france_noumea_182_days_ago

  - platform: template
    name: "Combined humidity"
    id: humidity_combined
    update_interval: 15s
    unit_of_measurement: "%"
    device_class: "humidity"
    state_class: "measurement"
    accuracy_decimals: 1
    lambda: |-
      bool have_ceiling = id(humidity_ceiling).has_state() && !std::isnan(id(humidity_ceiling).state);
      bool have_ground = id(humidity_ground).has_state() && !std::isnan(id(humidity_ground).state);
      if (have_ceiling && have_ground)
        return (id(humidity_ceiling).state + id(humidity_ground).state) / 2.0;
      if (have_ground)  // ceiling humidity missing (e.g. filtered out) -> ground only
        return id(humidity_ground).state;
      if (have_ceiling)
        return id(humidity_ceiling).state;
      return {};

time:
  - platform: homeassistant
    id: esptime
    timezone: "Europe/Berlin"
  # Deliberately the only clock. ESPHome time components are views onto ONE system clock
  # (settimeofday) with one global timezone, so a second "remote" clock set 182 days back did not
  # offset the weather -- it dragged the whole device, sun included, half a year into the past.
  # The weather offset lives in HA instead (the "*_182_days_ago" sensors).

sun:
  id: remote_sun
  # Sun ephemeris on local time. The terrarium stands in the northern hemisphere, so its day/night
  # cycle and seasons are local: summer solstice ~June 20, sun high, long summer days. Only the
  # *weather* feed comes from Noumea 182 days ago, via the historic HA sensors.
  time_id: esptime
  #latitude: -22.6
  #longitude: 167.5
  # Original Noumea latitude (22.6°S) mirrored to the northern hemisphere, i.e. kept near the
  # equator for a tropical day length, paired with the actual local installation longitude, moved
  # west by `day_shift_hours` (15° per hour) so that the sun runs that much later.
  latitude: 22.6
  longitude: ${ local_longitude - 15 * day_shift_hours }

climate:
  - platform: pid
    id: thermostat_air
    name: "Thermostat Air"
    sensor: temperature_ceiling
    default_target_temperature: 22 °C
    heat_output: gecko_lights
    cool_output: multifan
    visual:
      min_temperature: 12
      max_temperature: 36
    control_parameters:
      kp: 2.34544
      ki: 0.00987
      kd: 208.97874
      # The ceiling temperature arrives in 0.1 K steps: one step inside a single 15 s reading would
      # be a one-off D spike of kd*0.1/15 ~ 1.4 (full output). Averaging over 4 readings (1 min)
      # spreads it back into the slope it really is.
      derivative_averaging_samples: 4

  - platform: pid
    id: hygrostat
    name: "Hygrostat"
    internal: true   # hidden from HA; humidity is exposed as the "Target Humidity" number (%)
    sensor: humidity_combined
    default_target_temperature: 70 °C
    heat_output: rain_pump_float   # humidification is now the rain pump (was fogger)
    cool_output: multifan
    visual:
      min_temperature: 30
      max_temperature: 100
      temperature_step: 2
    control_parameters:
      kp: 0.22
      ki: 0.005
      kd: 6.38

# The hygrostat (a PID climate) is hidden because HA renders a climate setpoint in °C.
# Expose its humidity setpoint as a proper percentage instead. Current humidity is the
# "Combined humidity" sensor (%).
number:
  - platform: template
    name: "Target Humidity"
    id: target_humidity_number
    icon: mdi:water-percent
    device_class: humidity
    unit_of_measurement: "%"
    mode: slider
    min_value: 30
    max_value: 100
    step: 2
    lambda: |-
      return id(hygrostat).target_temperature;
    set_action:
      - climate.control:
          id: hygrostat
          target_temperature: !lambda 'return x;'

  # Manual fan control (speed in %, 0 = off). Only effective while the "Multifan Auto"
  # switch is off: in auto mode the combined PID formula owns the fan, so a manual set is refused
  # and the slider snaps back. Refused during cool/dehumidify PID calibration too, where the
  # autotune relay drives the PWM directly. The value always tracks the real fan speed, so it also
  # shows what the automation is currently running at.
  - platform: template
    name: "Fan Manual Speed"
    id: fan_manual_speed
    icon: mdi:fan
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 5
    update_interval: 15s
    lambda: |-
      return (float) (id(multifan_status).state ? id(multifan_status).speed : 0);
    set_action:
      - lambda: |-
          auto current = [] { return (float) (id(multifan_status).state ? id(multifan_status).speed : 0); };
          if (id(multifan_auto)) {
            ESP_LOGW("gecko", "manual fan speed %.0f%% ignored: Multifan Auto is on", x);
            id(fan_manual_speed).publish_state(current());
            return;
          }
          int cal = id(calibration_target);
          if (cal == 3 || cal == 5) {   // CAL_COOL / CAL_DEHUMID: the autotune relay owns the fan
            ESP_LOGW("gecko", "manual fan speed %.0f%% ignored: PID calibration in progress", x);
            id(fan_manual_speed).publish_state(current());
            return;
          }
          ESP_LOGI("gecko", "manual fan speed: %.0f%%", x);
          auto call = id(multifan_status).make_call();
          call.set_state(x > 0.0f);
          call.set_speed((int) x);
          call.perform();

  # Daylight lamp level (%) while "Daylight Manual" is on. Always tracks the lamp's real level, so
  # it also shows what the thermostat runs it at; a set is refused (and snaps back) while
  # "Daylight Manual" is off, as with "Fan Manual Speed".
  - platform: template
    name: "Daylight Manual Level"
    id: daylight_manual_level
    icon: mdi:brightness-percent
    unit_of_measurement: "%"
    mode: slider
    min_value: 0
    max_value: 100
    step: 1
    update_interval: 5s
    lambda: |-
      const auto &rv = id(day_light).remote_values;
      return rv.is_on() ? rv.get_brightness() * 100.0f : 0.0f;
    set_action:
      - lambda: |-
          if (!id(gecko_lights).daylight_manual().has_value()) {
            ESP_LOGW("gecko", "daylight level %.0f%% ignored: Daylight Manual is off", x);
            const auto &rv = id(day_light).remote_values;
            id(daylight_manual_level).publish_state(rv.is_on() ? rv.get_brightness() * 100.0f : 0.0f);
            return;
          }
          id(gecko_lights).set_daylight_manual(x / 100.0f);
          id(daylight_manual_level).publish_state(x);

# Climate alarms (Home Assistant: "Problem" / "OK"). They look at the outcome only -- the
# thermostat's and hygrostat's current value against their setpoint -- so they catch a blown lamp,
# a clogged rain pipe or a lamp left on by hand, with the automations on or off. Raised after the
# value has been out of range for `delay` without a break; cleared once it has been back inside the
# limit by the hysteresis for `clear_delay`.
# Sensor health ("Sensor Problem", "Sensor Problem Details" naming them): a watched sensor without a
# valid reading for `sensor_timeout` -- missing, broken, failing its reads. Scale and substrate are
# judged by their raw readings, as their delta filters hold steady values back for hours. The
# historic weather counts too: missing while geckoweather's fallback stands in for a feed, stuck while
# the historic temperature (hourly, 0.1 °C) has not changed for `stale_timeout`. Not judged while
# Home Assistant is away -- a restart of it does not end in a sensor problem.
geckoalarm:
  id: gecko_alarm
  thermostat: thermostat_air
  hygrostat: hygrostat
  temperature_deviation: 4      # K above / below the thermostat setpoint
  humidity_deficit: 10          # %RH below the humidity setpoint
  temperature_hysteresis: 0.5   # K
  humidity_hysteresis: 2        # %RH
  delay: 10min
  clear_delay: 2min
  overtemperature:
    name: "Overtemperature Alarm"
  undertemperature:
    name: "Undertemperature Alarm"
  low_humidity:
    name: "Low Humidity Alarm"
  sensor_timeout: 2min
  sensors:
    - temperature_ceiling
    - humidity_ceiling
    - temperature_ground
    - humidity_ground
    # - sensor: temperature_substrate
    #   raw: true
    - sensor: gecko_scale
      raw: true
  weather:
    id: gecko_weather
    stale_timeout: 3h
  sensor_problem:
    name: "Sensor Problem"
  sensor_problem_details:
    name: "Sensor Problem Details"

# PID auto-calibration: owns 5 tuned parameter sets (heat_day/heat_night/cool/humidify/dehumidify),
# persists them, and swaps the active set per climate action. The thermostat's heating set is
# additionally swapped on the day<->night transition (daylight lamp vs heat lamp). See PID_CALIBRATION.md.
geckopid:
  id: gecko_pid
  thermostat: thermostat_air
  hygrostat: hygrostat
  vicinity: temperature_vicinity
  calibration_target: calibration_target
  is_daytime: is_daytime

globals:
   - id: scenic_light_effect
     type: uint8_t
     restore_value: no
     initial_value: '0'

   # The one sky-attenuation figure (0..1, from the weather matrix's oktas): how bright the
   # terrarium looks under the current weather. Scales the growlight/scenic pair by day and the
   # moonlight by night. Not the daylight lamp -- that one is the daytime heater, driven by the PID.
   - id: skycond_attenuation
     type: float
     restore_value: no
     initial_value: '0.7'

   - id: is_daytime
     type: bool
     restore_value: yes
     initial_value: 'false'

   # Multifan auto mode: true = PID drives the fan, false = HA slider drives it.
   - id: multifan_auto
     type: bool
     restore_value: no          # always ENABLED on power-on (see esphome.on_boot comment)
     initial_value: 'true'

   # Light automation enable: true = sun-driven day/night cycles + daylight/RGB effects run,
   # false = lights freeze in their current state (heating still gated by the thermostat).
   - id: lights_enabled
     type: bool
     restore_value: no          # always ENABLED on power-on (see esphome.on_boot comment)
     initial_value: 'true'

   # Weather setpoint enable: true = the weather feed sets the thermostat target,
   # false = manual target (from HA or the Geckoconsole).
   - id: weather_setpoint
     type: bool
     restore_value: no          # always ENABLED on power-on (see esphome.on_boot comment)
     initial_value: 'true'

   # Rain automation enable: true = weather/humidity arbitration drives the pump,
   # false = no automatic rain/humidification (the "Let it rain" button still works).
   - id: rain_enabled
     type: bool
     restore_value: no          # always ENABLED on power-on (see esphome.on_boot comment)
     initial_value: 'true'

   # Outlet 2 (relay K92) mode: false = "Grow Light" (coupled to the fader), true = "Aux Power".
   # A wiring fact, not an automation enable, so it is restored across reboots. Default Aux: a fresh
   # flash must not cut whatever hangs on the outlet.
   - id: outlet2_aux
     type: bool
     restore_value: yes
     initial_value: 'true'

   # Outlet 2 on/off in "Aux Power" mode (the "Aux Power" switch). Restored; default on.
   - id: outlet2_aux_on
     type: bool
     restore_value: yes
     initial_value: 'true'

   # PID calibration target: 0 none · 1 heat_day · 2 heat_night · 3 cool · 4 humidify · 5 dehumidify.
   # Set by geckopid during calibration; read by the actuators to pass the relay output through.
   - id: calibration_target
     type: int
     restore_value: no
     initial_value: '0'

binary_sensor:
  # On while geckoweather's standard day/night cycle stands in for any lost historic weather feed.
  - platform: template
    name: "Weather Fallback"
    icon: mdi:weather-cloudy-alert
    lambda: 'return id(gecko_weather).in_fallback();'

  # Gecko in / out of its nest (the scale is under it), published by gecko_nest.h
  - platform: template
    id: gecko_in_nest
    name: "Gecko in nest"
    device_class: occupancy
    icon: mdi:egg-outline

text_sensor:
  # Next sunrise / sunset of the (shifted) sun at the elevation the colour sweeps start at; the
  # console counts down to them
  - platform: sun
    sun_id: remote_sun
    name: "Next Sunrise"
    id: next_sunrise
    type: sunrise
    elevation: 5°
    format: "%Y-%m-%dT%H:%M:%SZ"
    device_class: timestamp
  - platform: sun
    sun_id: remote_sun
    name: "Next Sunset"
    id: next_sunset
    type: sunset
    elevation: 5°
    format: "%Y-%m-%dT%H:%M:%SZ"
    device_class: timestamp

  # gecko_nest.h: start of the current in / out period, and state + last periods for the console
  - platform: template
    id: gecko_nest_since
    name: "Gecko nest Since"
    device_class: timestamp
    update_interval: never
  - platform: template
    id: gecko_nest_log
    name: "Gecko nest Log"
    icon: mdi:format-list-bulleted
    entity_category: diagnostic
    update_interval: never

interval:
  - interval: 1s
    then:
      - lambda: 'gecko_nest::nest.tick();'

status_led:
  pin: GPIO12
