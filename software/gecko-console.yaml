# Geckoconsole: wall console for the Geckocontroller. ESP32-DevKitC (38 pin, WROOM-32 module) with
# a 2.4" ILI9341 320x240 SPI display and XPT2046 touch, operated by touch alone. Talks to the
# Geckocontroller (gecko.yaml) and gets the historic weather from Home Assistant.
#
# The UI (navigation, pages, region-based rendering) lives in external_components/gecko_console.h;
# this file wires sensors, inputs and Home Assistant to it.
#
# The console changes controller settings through Home Assistant actions (scripts ha_* below):
# in HA, enable "Allow the device to perform Home Assistant actions" for this device.
#
# Wiring: the display module's header (MSP2402, pins 1-14) follows the DevKitC's right-hand header J3
# top to bottom, so the dupont wires run side by side without crossing. Skipped on J3: TX/RX (J3-4/5,
# serial console), the second GND (J3-7) and GPIO0 (J3-14, boot strap).
#   module               DevKitC
#    1 VCC          ->   J2-19 5V   (the one wire to the other side, see below)
#    2 GND          ->   J3-1  GND
#    3 CS           ->   J3-2  GPIO23
#    4 RESET        ->   J3-3  GPIO22
#    5 DC/RS        ->   J3-6  GPIO21
#    6 SDI (MOSI)   ->   J3-8  GPIO19
#    7 SCK          ->   J3-9  GPIO18
#    8 LED          ->   J3-10 GPIO5    (backlight PWM; strap pin, its boot pull-up just lights it early)
#    9 SDO (MISO)   ->   -              (unconnected: the display is never read)
#   10 T_CLK        ->   J3-11 GPIO17
#   11 T_CS         ->   J3-12 GPIO16
#   12 T_DIN        ->   J3-13 GPIO4
#   13 T_DO         ->   J3-15 GPIO2    (strap pin; T_DO floats while T_CS is high, as it requires)
#   14 T_IRQ        ->   J3-16 GPIO15   (strap pin that wants to be high at boot: PENIRQ idles high;
#                                        the internal pull-up replaces the external one GPIO35 needed)
# Touch has an SPI bus of its own (no wire shared with the display, no Y-splitters); both buses run
# through the GPIO matrix, fine for the display's write-only 40 MHz and the touch's 2 MHz.
# GPIO16/17 are free on WROOM-32 modules only (WROVER uses them for its PSRAM).
#
# Power: VCC from 5 V, so the module's own 3.3 V regulator feeds the backlight, apart from the
# ESP32's 3.3 V rail (on the old PCB the backlight current made that rail sag with the CPU load and
# the display pulse at the frame rate). Logic stays 3.3 V. The MSP2402 has no bypass jumper: VCC
# always goes through its regulator (SOT-23, marked "662K", next to the header).

esphome:
  name: geckoconsole
  includes:
    - external_components/gecko_history.h
    - external_components/gecko_scene.h
    - external_components/gecko_console.h
  on_boot:
    priority: 250
    then:
      - binary_sensor.template.publish:
          id: api_connected
          state: OFF
      - wait_until:
          api.connected
      - binary_sensor.template.publish:
          id: api_connected
          state: ON

esp32:
  board: esp32dev   # ESP32-DevKitC
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot (captive portal) in case the wifi connection fails
  ap:
    ssid: "Geckocontrol Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

globals:
  # Connection wait indicator (0..16)
  - id: wi
    type: unsigned char
    initial_value: '0'

script:
  # Home Assistant calls made by the UI (gecko_console.h)
  - id: ha_call   # action on an entity without data: switch.turn_on/off, button.press, light.turn_off
    mode: queued
    max_runs: 10
    parameters:
      action: string
      entity: string
    then:
      - homeassistant.action:
          action: !lambda 'return action;'
          data:
            entity_id: !lambda 'return entity;'
  - id: ha_number
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      value: float
    then:
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: !lambda 'return entity;'
            value: !lambda 'return str_sprintf("%.0f", value);'
  - id: ha_climate_temperature
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      temperature: float
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda 'return entity;'
            temperature: !lambda 'return str_sprintf("%.1f", temperature);'
  - id: ha_light_brightness
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      pct: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return entity;'
            brightness_pct: !lambda 'return to_string(pct);'
  - id: ha_light_hs
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      hue: float
      sat: float
      brightness: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return entity;'
            brightness: !lambda 'return to_string(brightness);'
          data_template:
            hs_color: '[{{ h }}, {{ s }}]'
          variables:
            h: 'return hue;'
            s: 'return sat;'

time:
  - platform: homeassistant
    id: ha_time

spi:
  - id: display_bus
    interface: spi3
    clk_pin: GPIO18
    mosi_pin: GPIO19
  - id: touch_bus
    interface: spi2
    clk_pin: GPIO17
    mosi_pin: GPIO4
    miso_pin:
      number: GPIO2
      ignore_strapping_warning: true   # floats while T_CS is high, as GPIO2 needs at boot

binary_sensor:
  - platform: template
    id: api_connected
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CONNECTION);'

  # Controller automation switches and light states (read from Home Assistant)
  - platform: homeassistant
    id: rain_automation
    entity_id: switch.geckocontrol_rain_automation
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_RAIN_AUTO);'
  - platform: homeassistant
    id: light_automation
    entity_id: switch.geckocontrol_light_automation
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_LIGHT_AUTO);'
  - platform: homeassistant
    id: multifan_auto
    entity_id: switch.geckocontrol_multifan_auto
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND_AUTO);'
  - platform: homeassistant
    id: weather_setpoint
    entity_id: switch.geckocontrol_weather_setpoint
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WEATHER_SET);'
  # Heater shown on the Thermo page: daylight lamp by day, heat lamp at night
  - platform: homeassistant
    id: daytime
    entity_id: switch.geckocontrol_daytime
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: daylight_on
    entity_id: light.geckocontrol_dimmer_daylight
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: heat_lamp_on
    entity_id: light.geckocontrol_heat_lamp
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: grow_light_on
    entity_id: light.geckocontrol_grow_light
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_GROW);'
  - platform: homeassistant
    id: scenic_light_on
    entity_id: light.geckocontrol_scenic_light
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_SCENIC);'

sensor:
  - platform: wifi_signal
    id: wifisignal
    update_interval: 20s
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIFI);'

  # --- Controller values from Home Assistant ---
  # Thermostat (the weather feed drives its target)
  - platform: homeassistant
    id: thermostat_current_temperature
    entity_id: climate.geckocontrol_thermostat_air
    attribute: current_temperature
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  - platform: homeassistant
    id: thermostat_target_temperature
    entity_id: climate.geckocontrol_thermostat_air
    attribute: temperature
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  # Humidity: the hygrostat itself is internal to the controller; current value is the combined
  # ceiling/ground humidity, the setpoint is the "Target Humidity" number.
  - platform: homeassistant
    id: humidity_current
    entity_id: sensor.geckocontrol_combined_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  - platform: homeassistant
    id: humidity_target
    entity_id: number.geckocontrol_target_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  - platform: homeassistant
    id: ground_temperature
    entity_id: sensor.geckocontrol_ground_temperature
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  - platform: homeassistant
    id: ceiling_humidity
    entity_id: sensor.geckocontrol_ceiling_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  - platform: homeassistant
    id: ground_humidity
    entity_id: sensor.geckocontrol_ground_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  # Historic weather the controller follows
  - platform: homeassistant
    id: weather_temperature
    entity_id: sensor.temperature_in_france_noumea_182_days_ago
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  - platform: homeassistant
    id: weather_humidity
    entity_id: sensor.humidity_in_france_noumea_182_days_ago
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  # Rain reservoir
  - platform: homeassistant
    id: reservoir_level
    entity_id: sensor.geckocontrol_reservoir_level
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_RESERVOIR);'
  # Lights
  - platform: homeassistant
    id: grow_light_brightness
    entity_id: light.geckocontrol_grow_light
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_GROW);'
  - platform: homeassistant
    id: illumination
    entity_id: sensor.geckocontrol_illumination
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_GROW);'
  - platform: homeassistant
    id: scenic_light_brightness
    entity_id: light.geckocontrol_scenic_light
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_SCENIC);'
  # Wind (terrarium Multifan) and the weather wind (km/h) that bounds its speed
  - platform: homeassistant
    id: weather_windspeed
    entity_id: sensor.windspeed_in_france_noumea_182_days_ago
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: multifan_percentage
    entity_id: fan.geckocontrol_gecko_multifan_status
    attribute: percentage
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: fan_manual_speed
    entity_id: number.geckocontrol_fan_manual_speed
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: fan_tacho
    entity_id: sensor.geckocontrol_fan_tacho
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: daylight_brightness
    entity_id: light.geckocontrol_dimmer_daylight
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: heat_lamp_brightness
    entity_id: light.geckocontrol_heat_lamp
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  # Start page sky: the historic weather code the controller follows (WMO), the controller's sun
  # (its day is shifted, see gecko.yaml) and the historic moon
  - platform: homeassistant
    id: weather_wmo
    entity_id: sensor.weather_code_in_france_noumea_182_days_ago
  - platform: homeassistant
    id: sun_elevation
    entity_id: sensor.geckocontrol_sun_elevation
  - platform: homeassistant
    id: moon_illumination
    entity_id: sensor.moon_in_france_noumea_182_days_ago
  # Gecko scale (g) under its nest; ~0 while the gecko is out
  - platform: homeassistant
    id: scale_weight
    entity_id: sensor.geckocontrol_scale
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_SCALE);'

text_sensor:
  - platform: homeassistant
    id: scenic_light_hs
    entity_id: light.geckocontrol_scenic_light
    attribute: hs_color
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_SCENIC);'
  # Settings page test buttons: highlighted while their sweep runs / an override is in force
  - platform: homeassistant
    id: scenic_light_effect
    entity_id: light.geckocontrol_scenic_light
    attribute: effect
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEST_STATE);'
  - platform: homeassistant
    id: weather_override
    entity_id: select.geckocontrol_weather_override_test
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEST_STATE);'
  # Gecko in / out of its nest since when, and the last periods (the controller's gecko_nest.h)
  - platform: homeassistant
    id: gecko_nest_log
    entity_id: sensor.geckocontrol_gecko_nest_log
    on_value:
      - lambda: 'gecko_ui::ui.gecko_log(x);'
  # Start page countdown: the controller's next sunrise / sunset (when the colour sweeps start)
  - platform: homeassistant
    id: next_sunrise
    entity_id: sensor.geckocontrol_next_sunrise
  - platform: homeassistant
    id: next_sunset
    entity_id: sensor.geckocontrol_next_sunset
  # Shown on the Settings page
  - platform: wifi_info
    ssid:
      id: net_ssid
      on_value:
        - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIFI);'
    ip_address:
      id: net_ip
      on_value:
        - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIFI);'

output:
  - platform: ledc
    id: backlight_pwm
    pin:
      number: GPIO5
      ignore_strapping_warning: true   # boot pull-up only lights the backlight early

light:
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    # Always on at boot, with the brightness last set (Settings page or Home Assistant)
    restore_mode: RESTORE_AND_ON
    default_transition_length: 250ms
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_BACKLIGHT);'

interval:
  # Performs pending redraws. Never call component.update on the display directly.
  - interval: 20ms
    then:
      - lambda: 'gecko_ui::ui.flush(id(gecko_display));'
  # Graph history: samples every graphed value into all time ranges (gecko_history.h)
  - interval: 2s
    then:
      - lambda: 'gecko_ui::sample_history();'
  # Idle timeout back to the overview, graph refresh
  - interval: 1s
    then:
      - lambda: 'gecko_ui::ui.tick();'
  # Connection wait animation
  - interval: 200ms
    then:
      - if:
          condition:
            binary_sensor.is_off: api_connected
          then:
            - lambda: |-
                id(wi) = id(wi) >= 16 ? 0 : id(wi) + 1;
                gecko_ui::ui.changed(gecko_ui::F_CONNECTION);
  # Header clock
  - interval: 60s
    then:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CLOCK);'

font:
  - file: "/usr/share/fonts/TTF/OpenSans-Regular.ttf"
    id: big_font
    size: 40
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  - file: "/usr/share/fonts/TTF/OpenSans-Light.ttf"
    id: small_font
    size: 26
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  - file: "/usr/share/fonts/TTF/OpenSans-Regular.ttf"
    id: mid_font
    size: 22
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  - file: "/usr/share/fonts/TTF/OpenSans-Light.ttf"
    id: tiny_font
    size: 17
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  # Material Design Icons, downloaded once at build time and cached in .esphome/. The version is
  # pinned: codepoints differ between mdi releases.
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icon_font
    size: 32
    glyphs: &icons [
      "\U000F050F",  # thermometer
      "\U000F058E",  # water-percent
      "\U000F0597",  # weather-rainy
      "\U000F01AB",  # cup-water
      "\U000F059D",  # weather-windy
      "\U000F0E66",  # sprout
      "\U000F03D8",  # palette
      "\U000F009E",  # bell-ring
      "\U000F009B",  # bell-off
      "\U000F004D",  # arrow-left
      "\U000F0493",  # cog
      "\U000F059C",  # weather-sunset-up
      "\U000F059B",  # weather-sunset-down
      "\U000F0595",  # weather-partly-cloudy
      ]
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icon_small
    size: 20
    glyphs: *icons
  # Start page weather icon
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icon_big
    size: 48
    glyphs: [
      "\U000F0599",  # weather-sunny
      "\U000F0594",  # weather-night
      "\U000F0595",  # weather-partly-cloudy
      "\U000F0F31",  # weather-night-partly-cloudy
      "\U000F0590",  # weather-cloudy
      "\U000F0591",  # weather-fog
      "\U000F0597",  # weather-rainy
      "\U000F0596",  # weather-pouring
      "\U000F0F33",  # weather-partly-rainy
      "\U000F0598",  # weather-snowy
      "\U000F067E",  # weather-lightning-rainy
      ]

color:
  - id: color_dark_purple
    red_int: 50
    green_int: 0
    blue_int: 127
  - id: color_gray
    red_int: 72
    green_int: 72
    blue_int: 72

image:
  - file: "external_components/geckocontrol-logo.png"
    id: gecko_logo
    type: RGB
  # Menu tile icon of the Gecko page
  - file: "external_components/geckocontrol-logo.png"
    id: gecko_icon
    type: RGB565
    transparency: alpha_channel
    resize: 36x36
  # Gecko line on the overview
  - file: "external_components/geckocontrol-logo.png"
    id: gecko_icon_small
    type: RGB565
    transparency: alpha_channel
    resize: 20x20
  # Scenic light colour wheel, rendered by tools/gen_colorwheel.py; looked up per pixel by the UI
  - file: "external_components/colorwheel.png"
    id: colorwheel
    type: RGB565

display:
  - platform: mipi_spi
    id: gecko_display
    model: ILI9341
    spi_id: display_bus
    cs_pin: GPIO23
    dc_pin: GPIO21
    reset_pin: GPIO22
    data_rate: 40MHz
    rotation: 90        # landscape, 320x240
    # 16-bit color without PSRAM: 2 stripes of 77 KB; the lambda runs once per stripe.
    buffer_size: 50%
    # No implicit clear: only what the lambda draws is sent (needed for partial redraws later).
    auto_clear_enabled: false
    update_interval: never   # redraws are driven by gecko_ui::ui.flush()
    lambda: 'gecko_ui::ui.draw(it);'

touchscreen:
  - platform: xpt2046
    id: touch
    display: gecko_display
    spi_id: touch_bus
    cs_pin: GPIO16
    interrupt_pin:
      number: GPIO15        # the driver enables the internal pull-up
      ignore_strapping_warning: true
    # Pressure needed to count as a touch (default 400). Measured: fingertip taps z 2000-2400;
    # untouched, the panel gives single noise readings at z 420-460 every 10-60 s (ghost taps).
    threshold: 1000
    calibration:
      x_min: 280
      x_max: 3810
      y_min: 360
      y_max: 3840
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      - lambda: 'gecko_ui::ui.touch_down(touch.x, touch.y);'
    on_update:
      - lambda: |-
          for (auto &tp : touches)
            gecko_ui::ui.touch_move(tp.x, tp.y);
    on_release:
      - lambda: 'gecko_ui::ui.touch_up();'
