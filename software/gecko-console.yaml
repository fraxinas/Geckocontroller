# Geckoconsole: wall console for the Geckocontroller. 2.4" ILI9341 320x240 SPI display with
# XPT2046 touch, rotary encoder with push button, a second button, buzzer, 6 RGB status LEDs
# (CO2 level) and an MH-Z19 CO2 sensor. Talks to the controller through Home Assistant.
#
# The UI (navigation, pages, region-based rendering) lives in external_components/gecko_console.h;
# this file wires sensors, inputs and Home Assistant to it.
#
# The console changes controller settings through Home Assistant actions (scripts ha_* below):
# in HA, enable "Allow the device to perform Home Assistant actions" for this device.
#
# Display/touch wiring (MSP2402 module -> Geckoconsole J31 / J1, see display-demo.yaml):
#   CS GPIO15, RESET GPIO21, DC GPIO22, MOSI GPIO23, SCK GPIO18, LED GPIO32,
#   T_CS GPIO17, T_DO (MISO) GPIO12, T_IRQ GPIO35; SDO unconnected.

esphome:
  name: geckoconsole
  includes:
    - external_components/gecko_history.h
    - external_components/gecko_console.h
  on_boot:
    priority: 250
    then:
      - light.turn_on:
          id: rgb_leds
          red: 28%
          green: 28%
          blue: 28%
      - binary_sensor.template.publish:
          id: api_connected
          state: OFF
      - wait_until:
          api.connected
      - binary_sensor.template.publish:
          id: api_connected
          state: ON
      - rtttl.play: "Turn_on:d=32,o=6,b=150:c,e,g,c7"

esp32:
  board: nodemcu-32s
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot (captive portal) in case the wifi connection fails
  ap:
    ssid: "Geckocontrol Fallback Hotspot"
    password: !secret fallback_password

captive_portal:

logger:
  level: DEBUG

api:
  actions:
    - action: play_rtttl
      variables:
        song_str: string
      then:
        - rtttl.play:
            rtttl: !lambda 'return song_str;'
    - action: mhz19_calibrate_zero
      then:
        - mhz19.calibrate_zero: co2_sensor

ota:
  - platform: esphome

globals:
  # Connection wait indicator (0..16)
  - id: wi
    type: unsigned char
    initial_value: '0'

script:
  # Home Assistant calls made by the UI (gecko_console.h)
  - id: ha_call   # action on an entity without data: switch.turn_on/off, button.press, light.turn_off
    mode: queued
    max_runs: 10
    parameters:
      action: string
      entity: string
    then:
      - homeassistant.action:
          action: !lambda 'return action;'
          data:
            entity_id: !lambda 'return entity;'
  - id: ha_number
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      value: float
    then:
      - homeassistant.action:
          action: number.set_value
          data:
            entity_id: !lambda 'return entity;'
            value: !lambda 'return str_sprintf("%.0f", value);'
  - id: ha_climate_temperature
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      temperature: float
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda 'return entity;'
            temperature: !lambda 'return str_sprintf("%.1f", temperature);'
  - id: ha_light_brightness
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      pct: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return entity;'
            brightness_pct: !lambda 'return to_string(pct);'
  - id: ha_light_hs
    mode: queued
    max_runs: 5
    parameters:
      entity: string
      hue: float
      sat: float
      brightness: int
    then:
      - homeassistant.action:
          action: light.turn_on
          data:
            entity_id: !lambda 'return entity;'
            brightness: !lambda 'return to_string(brightness);'
          data_template:
            hs_color: '[{{ h }}, {{ s }}]'
          variables:
            h: 'return hue;'
            s: 'return sat;'

  - id: co2_warning_action
    then:
      - if:
          condition:
            and:
              - binary_sensor.is_on: api_connected
              - switch.is_on: co2_warning_sound
          then:
            - rtttl.play: "GoodBad:d=4,o=5,b=56:32p,32a#,32d#6,32a#,32d#6,8a#.,16f#.,16g#.,d#,32a#,32d#6,32a#,32d#6,8a#.,16f#.,16g#.,c#6,32a#,32d#6,32a#,32d#6,8a#.,16f#.,32f.,32d#.,c#,32a#,32d#6,32a#,32d#6,8a#.,16g#.,d#,1p,1p,1p,1p,1p,1p"
            - delay: 45s

time:
  - platform: homeassistant
    id: ha_time

spi:
  # Display and touch share the bus. MISO on GPIO12 is not a native VSPI pin, so the bus runs
  # through the GPIO matrix; fine for 40 MHz writes (the display is never read, touch runs at 2 MHz).
  interface: spi3
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin:
    number: GPIO12
    ignore_strapping_warning: true   # MISO idles low/floating at boot, as GPIO12 requires

uart:
  rx_pin: GPIO33
  tx_pin: GPIO13
  baud_rate: 9600

i2c:
  sda: GPIO25
  scl: GPIO26
  scan: true
  id: bus_a

switch:
  # Mutes the CO2 alarm melody; also available in Home Assistant.
  - platform: template
    id: co2_warning_sound
    name: "CO2 Warning Sound"
    icon: mdi:bell-ring
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CO2_SOUND);'
    on_turn_off:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CO2_SOUND);'

number:
  # CO2 level that sounds the alarm melody; drawn as the dashed red line in the CO2 graph.
  # Set it in Home Assistant; kept across reboots.
  - platform: template
    id: co2_alarm_threshold
    name: "CO2 Alarm Threshold"
    icon: mdi:molecule-co2
    unit_of_measurement: ppm
    mode: box
    min_value: 800
    max_value: 5000
    step: 50
    initial_value: 1800
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CO2_ALARM);'

binary_sensor:
  - platform: gpio
    id: rotary_dial_push
    name: "Rotary Button"
    internal: true
    pin:
      number: GPIO34
      inverted: true
    on_press:
      - lambda: 'gecko_ui::ui.push();'

  - platform: gpio
    id: button_2
    internal: true
    pin:
      number: GPIO5
      inverted: true
      ignore_strapping_warning: true
    on_press:
      - lambda: 'gecko_ui::ui.back();'

  - platform: template
    id: api_connected
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CONNECTION);'

  # Controller automation switches and light states (read from Home Assistant)
  - platform: homeassistant
    id: rain_automation
    entity_id: switch.geckocontrol_rain_automation
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_RAIN_AUTO);'
  - platform: homeassistant
    id: light_automation
    entity_id: switch.geckocontrol_light_automation
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_LIGHT_AUTO);'
  - platform: homeassistant
    id: multifan_auto
    entity_id: switch.geckocontrol_multifan_auto
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND_AUTO);'
  - platform: homeassistant
    id: weather_setpoint
    entity_id: switch.geckocontrol_weather_setpoint
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WEATHER_SET);'
  # Heater shown on the Thermo page: daylight lamp by day, heat lamp at night
  - platform: homeassistant
    id: daytime
    entity_id: switch.geckocontrol_daytime
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: daylight_on
    entity_id: light.geckocontrol_dimmer_daylight
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: heat_lamp_on
    entity_id: light.geckocontrol_heat_lamp
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: grow_light_on
    entity_id: light.geckocontrol_grow_light
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_GROW);'
  - platform: homeassistant
    id: scenic_light_on
    entity_id: light.geckocontrol_scenic_light
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_SCENIC);'

sensor:
  - platform: rotary_encoder
    id: rotary_dial
    name: "Rotary Encoder"
    internal: true
    pin_a: GPIO27
    pin_b: GPIO14
    resolution: 2
    on_clockwise:
      - lambda: 'gecko_ui::ui.turn(+1);'
    on_anticlockwise:
      - lambda: 'gecko_ui::ui.turn(-1);'

  - platform: wifi_signal
    id: wifisignal
    update_interval: 20s
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIFI);'

  - platform: mhz19
    id: co2_sensor
    co2:
      name: "MH-Z19 CO2 Value"
      id: co2_val
      on_value:
        then:
          - lambda: |-
              if (!id(api_connected).state)
                return;
              const Color c = gecko_ui::co2_color(x);
              auto call = id(rgb_leds).make_call();
              call.set_rgb(c.r / 255.f, c.g / 255.f, 0.f);
              call.perform();
              id(color_co2) = c;
              if (x > id(co2_alarm_threshold).state)
                id(co2_warning_action).execute();
          - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CO2);'
    temperature:
      name: "MH-Z19 Temperature"
      id: temp_val
    update_interval: 20s
    automatic_baseline_calibration: false

  # --- Controller values from Home Assistant ---
  # Thermostat (the weather feed drives its target)
  - platform: homeassistant
    id: thermostat_current_temperature
    entity_id: climate.geckocontrol_thermostat_air
    attribute: current_temperature
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  - platform: homeassistant
    id: thermostat_target_temperature
    entity_id: climate.geckocontrol_thermostat_air
    attribute: temperature
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  # Humidity: the hygrostat itself is internal to the controller; current value is the combined
  # ceiling/ground humidity, the setpoint is the "Target Humidity" number.
  - platform: homeassistant
    id: humidity_current
    entity_id: sensor.geckocontrol_combined_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  - platform: homeassistant
    id: humidity_target
    entity_id: number.geckocontrol_target_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  - platform: homeassistant
    id: ground_temperature
    entity_id: sensor.geckocontrol_ground_temperature
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  - platform: homeassistant
    id: ceiling_humidity
    entity_id: sensor.geckocontrol_ceiling_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  - platform: homeassistant
    id: ground_humidity
    entity_id: sensor.geckocontrol_ground_humidity
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  # Historic weather the controller follows
  - platform: homeassistant
    id: weather_temperature
    entity_id: sensor.temperature_in_france_noumea_182_days_ago
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_TEMP);'
  - platform: homeassistant
    id: weather_humidity
    entity_id: sensor.humidity_in_france_noumea_182_days_ago
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HUM);'
  # Rain reservoir
  - platform: homeassistant
    id: reservoir_level
    entity_id: sensor.geckocontrol_reservoir_level
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_RESERVOIR);'
  # Lights
  - platform: homeassistant
    id: grow_light_brightness
    entity_id: light.geckocontrol_grow_light
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_GROW);'
  - platform: homeassistant
    id: illumination
    entity_id: sensor.geckocontrol_illumination
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_GROW);'
  - platform: homeassistant
    id: scenic_light_brightness
    entity_id: light.geckocontrol_scenic_light
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_SCENIC);'
  # Wind (terrarium Multifan) and the weather wind (km/h) that bounds its speed
  - platform: homeassistant
    id: weather_windspeed
    entity_id: sensor.windspeed_in_france_noumea_182_days_ago
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: multifan_percentage
    entity_id: fan.geckocontrol_gecko_multifan_status
    attribute: percentage
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: fan_manual_speed
    entity_id: number.geckocontrol_fan_manual_speed
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: fan_tacho
    entity_id: sensor.geckocontrol_fan_tacho
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_WIND);'
  - platform: homeassistant
    id: daylight_brightness
    entity_id: light.geckocontrol_dimmer_daylight
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'
  - platform: homeassistant
    id: heat_lamp_brightness
    entity_id: light.geckocontrol_heat_lamp
    attribute: brightness
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_HEATER);'

text_sensor:
  - platform: homeassistant
    id: scenic_light_hs
    entity_id: light.geckocontrol_scenic_light
    attribute: hs_color
    on_value:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_SCENIC);'

output:
  # LEDC channels share a timer in pairs (0/1, 2/3, ...). RTTTL retunes the buzzer's timer for every
  # note, which also changes its resolution, so the backlight needs a timer of its own.
  - platform: ledc
    id: buzzer
    pin: GPIO16
    channel: 0
  - platform: ledc
    id: backlight_pwm
    pin: GPIO32
    channel: 2

light:
  - platform: esp32_rmt_led_strip
    id: rgb_leds
    name: "RGB LEDs"
    pin: GPIO4
    num_leds: 6
    chipset: WS2812
    rgb_order: GRB
    default_transition_length: 0s
    color_correct: [50%, 50%, 50%]
    restore_mode: RESTORE_DEFAULT_ON
    on_state:
      - lambda: 'gecko_ui::ui.changed(gecko_ui::F_CO2_LEDS);'
  - platform: monochromatic
    id: backlight
    name: "Display Backlight"
    output: backlight_pwm
    restore_mode: ALWAYS_ON
    default_transition_length: 250ms

rtttl:
  id: rtttlplayer
  output: buzzer

status_led:
  pin:
    number: GPIO2
    ignore_strapping_warning: true

interval:
  # Performs pending redraws. Never call component.update on the display directly.
  - interval: 20ms
    then:
      - lambda: 'gecko_ui::ui.flush(id(gecko_display));'
  # Graph history: samples every graphed value into all time ranges (gecko_history.h)
  - interval: 2s
    then:
      - lambda: 'gecko_ui::sample_history();'
  # Idle timeout back to the overview, graph refresh
  - interval: 1s
    then:
      - lambda: 'gecko_ui::ui.tick();'
  # Connection wait animation
  - interval: 200ms
    then:
      - if:
          condition:
            binary_sensor.is_off: api_connected
          then:
            - lambda: |-
                id(wi) = id(wi) >= 16 ? 0 : id(wi) + 1;
                gecko_ui::ui.changed(gecko_ui::F_CONNECTION);
  # Header clock
  - interval: 60s
    then:
      - lambda: |-
          if (id(co2_sensor).status_has_warning()) {
            id(color_co2) = Color(64, 64, 64);
            gecko_ui::ui.changed(gecko_ui::F_CO2);
          }
          gecko_ui::ui.changed(gecko_ui::F_CLOCK);

font:
  - file: "/usr/share/fonts/TTF/OpenSans-Regular.ttf"
    id: big_font
    size: 40
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  - file: "/usr/share/fonts/TTF/OpenSans-Light.ttf"
    id: small_font
    size: 26
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  - file: "/usr/share/fonts/TTF/OpenSans-Regular.ttf"
    id: mid_font
    size: 22
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  - file: "/usr/share/fonts/TTF/OpenSans-Light.ttf"
    id: tiny_font
    size: 17
    glyphsets: [GF_Latin_Kernel]
    glyphs: "°₂"
  # Material Design Icons, downloaded once at build time and cached in .esphome/. The version is
  # pinned: codepoints differ between mdi releases.
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icon_font
    size: 32
    glyphs: &icons [
      "\U000F050F",  # thermometer
      "\U000F058E",  # water-percent
      "\U000F07E4",  # molecule-co2
      "\U000F0597",  # weather-rainy
      "\U000F01AB",  # cup-water
      "\U000F059D",  # weather-windy
      "\U000F0E66",  # sprout
      "\U000F03D8",  # palette
      "\U000F009E",  # bell-ring
      "\U000F009B",  # bell-off
      "\U000F004D",  # arrow-left
      ]
  - file:
      type: web
      url: https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/fonts/materialdesignicons-webfont.ttf
    id: icon_small
    size: 20
    glyphs: *icons

color:
  - id: color_dark_purple
    red_int: 50
    green_int: 0
    blue_int: 127
  - id: color_gray
    red_int: 72
    green_int: 72
    blue_int: 72
  - id: color_co2
    red_int: 64
    green_int: 64
    blue_int: 64

image:
  - file: "external_components/geckocontrol-logo.png"
    id: gecko_logo
    type: RGB
  # Scenic light colour wheel, rendered by tools/gen_colorwheel.py; looked up per pixel by the UI
  - file: "external_components/colorwheel.png"
    id: colorwheel
    type: RGB565

display:
  - platform: mipi_spi
    id: gecko_display
    model: ILI9341
    cs_pin:
      number: GPIO15
      ignore_strapping_warning: true   # idles high like its boot pull-up
    dc_pin: GPIO22
    reset_pin: GPIO21
    data_rate: 40MHz
    rotation: 90        # landscape, 320x240
    # 16-bit color without PSRAM: 2 stripes of 77 KB; the lambda runs once per stripe.
    buffer_size: 50%
    # No implicit clear: only what the lambda draws is sent (needed for partial redraws later).
    auto_clear_enabled: false
    update_interval: never   # redraws are driven by gecko_ui::ui.flush()
    lambda: 'gecko_ui::ui.draw(it);'

touchscreen:
  - platform: xpt2046
    id: touch
    display: gecko_display
    cs_pin: GPIO17
    interrupt_pin: GPIO35   # input-only pin, relies on a pull-up on T_IRQ
    # Pressure needed to count as a touch (default 400). Measured: fingertip taps z 2000-2400;
    # untouched, the panel gives single noise readings at z 420-460 every 10-60 s (ghost taps).
    threshold: 1000
    calibration:
      x_min: 280
      x_max: 3810
      y_min: 360
      y_max: 3840
    transform:
      swap_xy: true
      mirror_x: true
      mirror_y: false
    on_touch:
      - lambda: 'gecko_ui::ui.touch_down(touch.x, touch.y);'
    on_update:
      - lambda: |-
          for (auto &tp : touches)
            gecko_ui::ui.touch_move(tp.x, tp.y);
    on_release:
      - lambda: 'gecko_ui::ui.touch_up();'
